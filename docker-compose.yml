services:
  postgres:
    image: postgres:16-alpine
    container_name: cli-auth-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_cli"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cli-auth-app

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres

    depends_on:
      postgres:
        condition: service_healthy

    # Interactive CLI requires stdin and a TTY.
    stdin_open: true
    tty: true

volumes:
  postgres-data: